<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Location Verification</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; text-align: center; padding: 0 16px; }
    #status { margin-top: 20px; color: #555; }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
    pre { text-align: left; background: #f4f4f4; padding: 12px; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Verifying login location...</h2>
  <p id="status">Requesting location permission...</p>
  <pre id="details" style="display:none;"></pre>

  <script>
    function send(data) {
      fetch("/api/location", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(res => {
        document.getElementById("status").innerHTML =
          '<span class="ok">Location verified. You may continue.</span>';
        document.getElementById("details").style.display = "block";
        document.getElementById("details").textContent =
          "lat: " + data.lat + "\nlng: " + data.lng + "\naccuracy: " + data.accuracy + "m";
      })
      .catch(() => {
        document.getElementById("status").innerHTML =
          '<span class="err">Could not reach server.</span>';
      });
    }

    if (!navigator.geolocation) {
      document.getElementById("status").innerHTML =
        '<span class="err">Geolocation not supported by this browser.</span>';
    } else {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          send({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: Date.now()
          });
        },
        (err) => {
          document.getElementById("status").innerHTML =
            '<span class="err">Location permission denied or unavailable. Login blocked.</span>';
          fetch("/api/location", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ denied: true, error: err.message })
          });
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
